services:
  postgres:
    image: postgres:16-alpine
    container_name: ai_hs_go_pg
    environment:
      POSTGRES_USER: ai_hs
      POSTGRES_PASSWORD: ai_hs
      POSTGRES_DB: ai_hs_go
      TZ: Asia/Shanghai
    ports:
      - "5432:5432"
    volumes:
      - ai_hs_go_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai_hs -d ai_hs_go"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: ai_hs_go_redis
    ports:
      - "6379:6379"
    volumes:
      - ai_hs_go_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  ai_hs_go_pgdata:
  ai_hs_go_redisdata:
